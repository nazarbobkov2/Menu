<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню закладу</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#BFA46A;--gold-dim:#8C7545;
  --dark:#141210;--dark2:#1E1A16;--dark3:#28231D;
  --cream2:#C8B99A;--text:#EDE3D0;--muted:#8A7D68;
  --sep:rgba(191,164,106,0.18);--danger:#C86060;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}

.nav{display:flex;background:var(--dark2);border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:100}
.nav-btn{flex:1;padding:15px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.25s}
.nav-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.nav-btn:hover:not(.on){color:var(--text)}

.page{display:none}.page.on{display:block}

.loader-wrap{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:.4s}
.loader-wrap.hide{opacity:0;pointer-events:none}
.loader-name{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;color:var(--gold);letter-spacing:4px}
.loader-dots{display:flex;gap:8px;margin-top:20px}
.loader-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold-dim);animation:pulse 1.2s infinite}
.loader-dots span:nth-child(2){animation-delay:.2s}
.loader-dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.2}40%{opacity:1}}

.hero{text-align:center;padding:52px 24px 36px;background:var(--dark2);border-bottom:1px solid var(--sep)}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:300;color:var(--gold);letter-spacing:5px;line-height:1}
.hero-rule{width:52px;height:1px;background:var(--gold-dim);margin:14px auto}
.hero-sub{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--muted)}

.type-nav{display:flex;background:var(--dark2);border-bottom:1px solid var(--sep)}
.type-btn{flex:1;padding:13px;text-align:center;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;transition:.2s}
.type-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.type-btn:hover:not(.on){color:var(--text)}

.pills{display:flex;gap:8px;padding:20px 20px 8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:7px 16px;border-radius:100px;border:1px solid var(--sep);background:none;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s;flex-shrink:0}
.pill.on{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:500}
.pill:hover:not(.on){border-color:var(--gold-dim);color:var(--cream2)}

.menu-body{padding:28px 24px 80px;max-width:860px;margin:0 auto}

.cat-block{margin-bottom:48px}
.cat-header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.cat-header-line{flex:1;height:1px;background:var(--sep)}
.cat-title{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.cat-deco{width:5px;height:5px;border:1px solid var(--gold-dim);transform:rotate(45deg);flex-shrink:0}

.items-wrap{display:flex;flex-direction:column}
.dish{display:flex;align-items:baseline;gap:12px;padding:15px 0;border-bottom:1px solid var(--sep)}
.dish:last-child{border-bottom:none}
.dish-left{flex:1;min-width:0}
.dish-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--text);line-height:1.2}
.dish-comp{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7;font-weight:300}
.dish-dots{flex:1;border-bottom:1px dotted rgba(191,164,106,0.22);margin-bottom:4px;min-width:20px}
.dish-price{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--gold);white-space:nowrap;flex-shrink:0}
.dish-price-unit{font-family:'DM Sans',sans-serif;font-size:10px;color:var(--muted);letter-spacing:1px}
.empty-cat{padding:24px 0;text-align:center;color:var(--muted);font-size:13px;letter-spacing:1px}

#ap{padding:20px 20px 80px;max-width:680px;margin:0 auto}
.admin-top{text-align:center;padding:28px 0 28px}
.admin-top h2{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;color:var(--gold)}
.admin-top p{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.asec{margin-bottom:24px}
.asec-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card{background:var(--dark2);border:1px solid var(--sep);border-radius:10px;padding:18px}
.sep-line{border:none;border-top:1px solid var(--sep);margin:24px 0}

label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fg{margin-bottom:14px}
input,select,textarea{width:100%;padding:10px 12px;background:var(--dark);border:1px solid rgba(191,164,106,0.2);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--dark2)}
textarea{resize:vertical;min-height:72px;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn-g{background:var(--gold);color:var(--dark);font-weight:500}
.btn-g:hover{opacity:.85}
.bw{width:100%}
.btn-del{background:none;border:1px solid rgba(200,80,80,0.25);color:var(--danger);padding:5px 11px;font-size:10px;border-radius:6px;letter-spacing:1px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s}
.btn-del:hover{background:rgba(200,80,80,0.1)}

.cat-list{display:flex;flex-direction:column;gap:7px}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--dark);border:1px solid var(--sep);border-radius:7px}
.badge{font-size:9px;padding:3px 9px;border-radius:100px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
.bf{background:rgba(94,168,96,0.12);color:#7AC87C}
.bd{background:rgba(191,164,106,0.12);color:var(--gold)}
.bh{background:rgba(160,80,200,0.12);color:#C080E0}
.cat-row-name{flex:1;font-size:13px}
.cat-row-count{font-size:11px;color:var(--muted)}

.alist{display:flex;flex-direction:column;gap:6px}
.aitem{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--dark);border:1px solid var(--sep);border-radius:7px}
.aitem-info{flex:1;min-width:0}
.aitem-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aitem-price{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold);margin-right:6px;flex-shrink:0}

.atabs{display:flex;border-radius:8px;overflow:hidden;background:var(--dark);border:1px solid var(--sep);margin-bottom:14px}
.atab{flex:1;padding:9px;text-align:center;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s}
.atab.on{background:var(--gold);color:var(--dark);font-weight:500}

.sync-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#7AC87C;transition:.3s}
.sync-dot.saving{background:var(--gold);animation:pulse 1s infinite}
.sync-dot.error{background:var(--danger)}

.hint{text-align:center;padding:20px;color:var(--muted);font-size:12px;letter-spacing:1px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--gold);color:var(--dark);padding:10px 28px;border-radius:100px;font-size:12px;font-weight:500;letter-spacing:1px;opacity:0;transition:.3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
</style>
</head>
<body>

<div class="loader-wrap" id="loader">
  <div class="loader-name">Меню</div>
  <div class="loader-dots"><span></span><span></span><span></span></div>
</div>

<nav class="nav">
  <button class="nav-btn on" onclick="goPage('mp')">&#9474; Меню</button>
  <button class="nav-btn" onclick="goPage('ap')">&#9881; Адмін</button>
</nav>

<div id="mp" class="page on">
  <div class="hero">
    <div class="hero-name" id="hname">...</div>
    <div class="hero-rule"></div>
    <div class="hero-sub" id="hsub"></div>
  </div>
  <div class="type-nav">
    <button class="type-btn on" onclick="setType('food',this)">&#127869; Їжа</button>
    <button class="type-btn" onclick="setType('drink',this)">&#127865; Коктейлі</button>
    <button class="type-btn" onclick="setType('hookah',this)">&#128168; Кальяни</button>
  </div>
  <div class="pills" id="pills"></div>
  <div class="menu-body" id="mbody"></div>
</div>

<div id="ap" class="page">
  <div class="admin-top">
    <h2>Панель управління</h2>
    <p>Зміни зберігаються в хмарі автоматично</p>
  </div>

  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">Підключення...</span>
  </div>

  <div class="asec">
    <div class="asec-label">Назва закладу</div>
    <div class="card">
      <div class="fg"><label>Назва</label><input id="rn" placeholder="Введіть назву закладу..." oninput="upName()"></div>
      <div class="fg" style="margin-bottom:0"><label>Підзаголовок</label><input id="rs" placeholder="Наприклад: Bar & Kitchen" oninput="upSub()"></div>
    </div>
  </div>

  <hr class="sep-line">

  <div class="asec">
    <div class="asec-label">Нова категорія</div>
    <div class="card">
      <div class="fg"><label>Назва категорії</label><input id="ncn" placeholder="Наприклад: Страви з риби"></div>
      <div class="fg" style="margin-bottom:0">
        <label>Тип</label>
        <select id="nct">
          <option value="food">&#127869; Їжа</option>
          <option value="drink">&#127865; Коктейлі / Напої</option>
          <option value="hookah">&#128168; Кальяни</option>
        </select>
      </div>
      <div style="margin-top:14px"><button class="btn btn-g bw" onclick="addCat()">+ Додати категорію</button></div>
    </div>
  </div>

  <div class="asec">
    <div class="asec-label">Категорії</div>
    <div id="catList"></div>
  </div>

  <hr class="sep-line">

  <div class="asec">
    <div class="asec-label">Нова позиція в меню</div>
    <div class="card">
      <div class="fg"><label>Категорія</label><select id="ics"><option value="">— Оберіть категорію —</option></select></div>
      <div class="fg"><label>Назва страви / напою</label><input id="iname" placeholder="Наприклад: Карпаччо з телятини"></div>
      <div class="fg"><label>Склад / опис</label><textarea id="icomp" placeholder="Телятина, пармезан, руккола, каперси..."></textarea></div>
      <div class="fg" style="margin-bottom:0"><label>Ціна (грн)</label><input type="number" id="iprice" placeholder="0" min="0"></div>
      <div style="margin-top:14px"><button class="btn btn-g bw" onclick="addItem()">+ Додати позицію</button></div>
    </div>
  </div>

  <div class="asec">
    <div class="asec-label">Всі позиції</div>
    <div class="atabs">
      <button class="atab on" onclick="setAT('food',this)">Їжа</button>
      <button class="atab" onclick="setAT('drink',this)">Коктейлі</button>
      <button class="atab" onclick="setAT('hookah',this)">Кальяни</button>
    </div>
    <div id="alist"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBM1g9GVDa92IMCzBtEkAp0dOBxhLbCKv0",
  authDomain: "vzdsmenu.firebaseapp.com",
  databaseURL: "https://vzdsmenu-default-rtdb.firebaseio.com",
  projectId: "vzdsmenu",
  storageBucket: "vzdsmenu.firebasestorage.app",
  messagingSenderId: "542310832428",
  appId: "1:542310832428:web:5513e075a155add3f93489",
  measurementId: "G-CFZHF5DWBK"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let S = {
  name:'Назва закладу', sub:'',
  cats:[], items:[],
  menuType:'food', menuCat:null, atype:'food'
};
let saveTimer = null;

function gid(){ return 'i'+Date.now()+Math.random().toString(36).slice(2,5); }

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2200);
}

function setSyncStatus(st){
  const dot=document.getElementById('syncDot');
  const txt=document.getElementById('syncText');
  dot.className='sync-dot'+(st==='saving'?' saving':st==='error'?' error':'');
  txt.textContent=st==='saving'?'Збереження...':st==='error'?'Помилка зʼєднання':'Синхронізовано ✓';
}

function saveToFirebase(){
  setSyncStatus('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    set(ref(db,'menu'),{name:S.name,sub:S.sub,cats:S.cats,items:S.items})
      .then(()=>setSyncStatus('ok'))
      .catch(()=>{setSyncStatus('error');toast('Помилка збереження!');});
  },600);
}

// Real-time listener — оновлює UI на ВСІХ пристроях одночасно
onValue(ref(db,'menu'),(snapshot)=>{
  const data=snapshot.val();
  if(data){
    S.name =data.name ||'Назва закладу';
    S.sub  =data.sub  ||'';
    S.cats =data.cats ||[];
    S.items=data.items||[];
  } else {
    S.cats=[
      {id:'c1',name:'Холодні закуски',type:'food'},
      {id:'c2',name:'Салати',type:'food'},
      {id:'c3',name:'Страви з риби',type:'food'},
      {id:'c4',name:'Страви з птиці',type:'food'},
      {id:'c5',name:'Страви зі свинини',type:'food'},
      {id:'c6',name:'Гарячі страви',type:'food'},
      {id:'c7',name:'Страви з картоплі',type:'food'},
      {id:'c8',name:'Коктейлі',type:'drink'},
      {id:'c9',name:'Кальяни',type:'hookah'}
    ];
    saveToFirebase();
  }
  document.getElementById('hname').textContent=S.name;
  document.getElementById('hsub').textContent=S.sub;
  document.getElementById('rn').value=S.name;
  document.getElementById('rs').value=S.sub;
  document.title=S.name+' — Меню';
  renderMenu(); renderAdmin(); setSyncStatus('ok');
  const loader=document.getElementById('loader');
  loader.classList.add('hide');
  setTimeout(()=>loader.style.display='none',400);
},(err)=>{
  setSyncStatus('error');
  document.getElementById('loader').classList.add('hide');
  toast('Не вдалось підключитись до Firebase');
});

window.goPage=function(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.nav-btn')[id==='mp'?0:1].classList.add('on');
  if(id==='mp')renderMenu(); else renderAdmin();
};

window.upName=function(){
  S.name=document.getElementById('rn').value||'Назва закладу';
  document.getElementById('hname').textContent=S.name;
  document.title=S.name+' — Меню';
  saveToFirebase();
};
window.upSub=function(){
  S.sub=document.getElementById('rs').value||'';
  document.getElementById('hsub').textContent=S.sub;
  saveToFirebase();
};

window.setType=function(t,btn){
  S.menuType=t; S.menuCat=null;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); renderMenu();
};
window.filterCat=function(id){ S.menuCat=id; renderPills(); renderDishes(); };

function renderMenu(){ renderPills(); renderDishes(); }

function renderPills(){
  const cats=S.cats.filter(c=>c.type===S.menuType);
  const el=document.getElementById('pills');
  let h='<button class="pill'+(S.menuCat===null?' on':'')+'" onclick="filterCat(null)">Всі</button>';
  cats.forEach(c=>{
    const n=S.items.filter(i=>i.catId===c.id).length;
    h+='<button class="pill'+(S.menuCat===c.id?' on':'')+'" onclick="filterCat(\''+c.id+'\')">'
      +c.name+(n?' &middot; '+n:'')+'</button>';
  });
  el.innerHTML=h;
}

function renderDishes(){
  const cats=S.cats.filter(c=>c.type===S.menuType);
  const vis=S.menuCat?cats.filter(c=>c.id===S.menuCat):cats;
  const el=document.getElementById('mbody');
  if(!vis.length){el.innerHTML='<div class="hint">Категорії ще не додані.<br>Перейдіть в Адмін.</div>';return;}
  let h='';
  vis.forEach(cat=>{
    const items=S.items.filter(i=>i.catId===cat.id);
    h+='<div class="cat-block">'
      +'<div class="cat-header">'
      +'<div class="cat-header-line"></div>'
      +'<div class="cat-deco"></div>'
      +'<div class="cat-title">'+cat.name+'</div>'
      +'<div class="cat-deco"></div>'
      +'<div class="cat-header-line"></div>'
      +'</div>';
    if(!items.length){
      h+='<div class="empty-cat">Ще немає позицій у цій категорії</div>';
    } else {
      h+='<div class="items-wrap">';
      items.forEach(it=>{
        h+='<div class="dish">'
          +'<div class="dish-left">'
          +'<div class="dish-name">'+it.name+'</div>'
          +(it.comp?'<div class="dish-comp">'+it.comp+'</div>':'')
          +'</div>'
          +'<div class="dish-dots"></div>'
          +'<div class="dish-price">'+Math.round(it.price)+' <span class="dish-price-unit">грн</span></div>'
          +'</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  el.innerHTML=h;
}

window.addCat=function(){
  const name=document.getElementById('ncn').value.trim();
  const type=document.getElementById('nct').value;
  if(!name){toast('Введіть назву категорії');return;}
  S.cats.push({id:gid(),name,type});
  document.getElementById('ncn').value='';
  saveToFirebase(); renderAdmin(); renderMenu(); toast('Категорію додано!');
};

window.delCat=function(id){
  if(!confirm('Видалити категорію і всі позиції в ній?'))return;
  S.cats=S.cats.filter(c=>c.id!==id);
  S.items=S.items.filter(i=>i.catId!==id);
  saveToFirebase(); renderAdmin(); renderMenu(); toast('Категорію видалено');
};

window.addItem=function(){
  const catId=document.getElementById('ics').value;
  const name=document.getElementById('iname').value.trim();
  const comp=document.getElementById('icomp').value.trim();
  const price=document.getElementById('iprice').value;
  if(!catId){toast('Оберіть категорію');return;}
  if(!name){toast('Введіть назву');return;}
  if(!price){toast('Введіть ціну');return;}
  const cat=S.cats.find(c=>c.id===catId);
  S.items.push({id:gid(),catId,name,comp,price:parseFloat(price),type:cat.type});
  document.getElementById('iname').value='';
  document.getElementById('icomp').value='';
  document.getElementById('iprice').value='';
  saveToFirebase(); renderAdmin(); renderMenu(); toast('Позицію додано!');
};

window.delItem=function(id){
  S.items=S.items.filter(i=>i.id!==id);
  saveToFirebase(); renderAdmin(); renderMenu(); toast('Позицію видалено');
};

window.setAT=function(t,btn){
  S.atype=t;
  document.querySelectorAll('.atab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); renderAItems();
};

function renderAdmin(){
  const sel=document.getElementById('ics');
  const prev=sel.value;
  sel.innerHTML='<option value="">— Оберіть категорію —</option>';
  S.cats.forEach(c=>{
    const e=c.type==='food'?'&#127869;':c.type==='drink'?'&#127865;':'&#128168;';
    sel.innerHTML+='<option value="'+c.id+'"'+(prev===c.id?' selected':'')+'>'+e+' '+c.name+'</option>';
  });
  const cl=document.getElementById('catList');
  if(!S.cats.length){cl.innerHTML='<div class="hint">Ще немає категорій</div>';}
  else{
    let h='<div class="cat-list">';
    S.cats.forEach(c=>{
      const cnt=S.items.filter(i=>i.catId===c.id).length;
      const bc=c.type==='food'?'bf':c.type==='drink'?'bd':'bh';
      const bl=c.type==='food'?'Їжа':c.type==='drink'?'Напій':'Кальян';
      h+='<div class="cat-row">'
        +'<span class="badge '+bc+'">'+bl+'</span>'
        +'<span class="cat-row-name">'+c.name+'</span>'
        +'<span class="cat-row-count">'+cnt+' поз.</span>'
        +'<button class="btn-del" onclick="delCat(\''+c.id+'\')">&#10005;</button>'
        +'</div>';
    });
    cl.innerHTML=h+'</div>';
  }
  renderAItems();
}

function renderAItems(){
  const cats=S.cats.filter(c=>c.type===S.atype);
  const el=document.getElementById('alist');
  if(!cats.length){el.innerHTML='<div class="hint">Немає категорій цього типу</div>';return;}
  let h='';
  cats.forEach(cat=>{
    const items=S.items.filter(i=>i.catId===cat.id);
    h+='<div style="margin-bottom:18px">'
      +'<div style="font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;text-transform:uppercase">'+cat.name+'</div>';
    if(!items.length){h+='<div class="hint">Немає позицій</div>';}
    else{
      h+='<div class="alist">';
      items.forEach(it=>{
        h+='<div class="aitem">'
          +'<div class="aitem-info">'
          +'<div class="aitem-name">'+it.name+'</div>'
          +(it.comp?'<div class="aitem-sub">'+it.comp.slice(0,55)+(it.comp.length>55?'&hellip;':'')+'</div>':'')
          +'</div>'
          +'<div class="aitem-price">'+Math.round(it.price)+' грн</div>'
          +'<button class="btn-del" onclick="delItem(\''+it.id+'\')">&#10005;</button>'
          +'</div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  el.innerHTML=h;
}
</script>
</body>
</html>
