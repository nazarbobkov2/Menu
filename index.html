<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --gold: #BFA46A;
      --gold-dim: #8C7545;
      --gold-faint: rgba(191, 164, 106, 0.12);
      --dark: #141210;
      --dark2: #1E1A16;
      --dark3: #28231D;
      --dark4: #332C24;
      --cream: #F0E6D0;
      --cream2: #C8B99A;
      --text: #EDE3D0;
      --muted: #8A7D68;
      --sep: rgba(191, 164, 106, 0.18);
      --danger: #C86060;
    }

    html,
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh
    }

    /* NAV */
    .nav {
      display: flex;
      background: var(--dark2);
      border-bottom: 1px solid var(--sep);
      position: sticky;
      top: 0;
      z-index: 100
    }

    .nav-btn {
      flex: 1;
      padding: 15px 8px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .25s
    }

    .nav-btn.on {
      color: var(--gold);
      border-bottom-color: var(--gold)
    }

    .nav-btn:hover:not(.on) {
      color: var(--text)
    }

    /* PAGES */
    .page {
      display: none
    }

    .page.on {
      display: block
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 52px 24px 36px;
      background: var(--dark2);
      border-bottom: 1px solid var(--sep)
    }

    .hero-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px;
      font-weight: 300;
      color: var(--gold);
      letter-spacing: 5px;
      line-height: 1
    }

    .hero-rule {
      width: 52px;
      height: 1px;
      background: var(--gold-dim);
      margin: 14px auto
    }

    .hero-sub {
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted)
    }

    /* TYPE NAV */
    .type-nav {
      display: flex;
      background: var(--dark2);
      border-bottom: 1px solid var(--sep)
    }

    .type-btn {
      flex: 1;
      padding: 13px;
      text-align: center;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s
    }

    .type-btn.on {
      color: var(--gold);
      border-bottom-color: var(--gold)
    }

    .type-btn:hover:not(.on) {
      color: var(--text)
    }

    /* PILLS */
    .pills {
      display: flex;
      gap: 8px;
      padding: 20px 20px 8px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .pills::-webkit-scrollbar {
      display: none
    }

    .pill {
      white-space: nowrap;
      padding: 7px 16px;
      border-radius: 100px;
      border: 1px solid var(--sep);
      background: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s;
      flex-shrink: 0
    }

    .pill.on {
      background: var(--gold);
      color: var(--dark);
      border-color: var(--gold);
      font-weight: 500
    }

    .pill:hover:not(.on) {
      border-color: var(--gold-dim);
      color: var(--cream2)
    }

    /* MENU BODY */
    .menu-body {
      padding: 28px 24px 80px;
      max-width: 860px;
      margin: 0 auto
    }

    /* CATEGORY BLOCK */
    .cat-block {
      margin-bottom: 48px
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px
    }

    .cat-header-line {
      flex: 1;
      height: 1px;
      background: var(--sep)
    }

    .cat-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap
    }

    .cat-deco {
      width: 5px;
      height: 5px;
      border: 1px solid var(--gold-dim);
      transform: rotate(45deg);
      flex-shrink: 0
    }

    /* DISHES */
    .items-wrap {
      display: flex;
      flex-direction: column
    }

    .dish {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--sep)
    }

    .dish:last-child {
      border-bottom: none
    }

    .dish-left {
      flex: 1;
      min-width: 0
    }

    .dish-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.2
    }

    .dish-comp {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.7;
      font-weight: 300
    }

    .dish-dots {
      flex: 1;
      border-bottom: 1px dotted rgba(191, 164, 106, 0.22);
      margin-bottom: 4px;
      min-width: 20px
    }

    .dish-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 300;
      color: var(--gold);
      white-space: nowrap;
      flex-shrink: 0
    }

    .dish-price-unit {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px
    }

    .empty-cat {
      padding: 24px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px
    }

    /* ADMIN */
    #ap {
      padding: 20px 20px 80px;
      max-width: 680px;
      margin: 0 auto
    }

    .admin-top {
      text-align: center;
      padding: 28px 0 32px
    }

    .admin-top h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 300;
      color: var(--gold)
    }

    .admin-top p {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px
    }

    .asec {
      margin-bottom: 24px
    }

    .asec-label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px
    }

    .card {
      background: var(--dark2);
      border: 1px solid var(--sep);
      border-radius: 10px;
      padding: 18px
    }

    .sep-line {
      border: none;
      border-top: 1px solid var(--sep);
      margin: 24px 0
    }

    label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px
    }

    .fg {
      margin-bottom: 14px
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--dark);
      border: 1px solid rgba(191, 164, 106, 0.2);
      border-radius: 7px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: .2s
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold)
    }

    select option {
      background: var(--dark2)
    }

    textarea {
      resize: vertical;
      min-height: 72px;
      line-height: 1.6
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 20px;
      border: none;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s
    }

    .btn-g {
      background: var(--gold);
      color: var(--dark);
      font-weight: 500
    }

    .btn-g:hover {
      opacity: .85
    }

    .bw {
      width: 100%
    }

    .btn-del {
      background: none;
      border: 1px solid rgba(200, 80, 80, 0.25);
      color: var(--danger);
      padding: 5px 11px;
      font-size: 10px;
      border-radius: 6px;
      letter-spacing: 1px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: .2s
    }

    .btn-del:hover {
      background: rgba(200, 80, 80, 0.1)
    }

    /* CAT LIST */
    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--dark);
      border: 1px solid var(--sep);
      border-radius: 7px
    }

    .badge {
      font-size: 9px;
      padding: 3px 9px;
      border-radius: 100px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500
    }

    .bf {
      background: rgba(94, 168, 96, 0.12);
      color: #7AC87C
    }

    .bd {
      background: rgba(191, 164, 106, 0.12);
      color: var(--gold)
    }

    .bh {
      background: rgba(160, 80, 200, 0.12);
      color: #C080E0
    }

    .cat-row-name {
      flex: 1;
      font-size: 13px
    }

    .cat-row-count {
      font-size: 11px;
      color: var(--muted)
    }

    /* ADMIN ITEMS */
    .alist {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .aitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      background: var(--dark);
      border: 1px solid var(--sep);
      border-radius: 7px
    }

    .aitem-info {
      flex: 1;
      min-width: 0
    }

    .aitem-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .aitem-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .aitem-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      color: var(--gold);
      margin-right: 6px;
      flex-shrink: 0
    }

    .atabs {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      background: var(--dark);
      border: 1px solid var(--sep);
      margin-bottom: 14px
    }

    .atab {
      flex: 1;
      padding: 9px;
      text-align: center;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s
    }

    .atab.on {
      background: var(--gold);
      color: var(--dark);
      font-weight: 500
    }

    .hint {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--gold);
      color: var(--dark);
      padding: 10px 28px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      opacity: 0;
      transition: .3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap
    }

    .toast.on {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: var(--dark)
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gold-dim);
      border-radius: 2px
    }
  </style>
</head>

<body>

  <nav class="nav">
    <button class="nav-btn on" onclick="goPage('mp')">&#9474; Меню</button>
    <button class="nav-btn" onclick="goPage('ap')">&#9881; Адмін</button>
  </nav>

  <!-- MENU PAGE -->
  <div id="mp" class="page on">
    <div class="hero">
      <div class="hero-name" id="hname">Падвал</div>
      <div class="hero-rule"></div>
      <div class="hero-sub" id="hsub">Меню закладу</div>
    </div>
    <div class="type-nav">
      <button class="type-btn on" onclick="setType('food',this)">Їжа</button>
      <button class="type-btn" onclick="setType('drink',this)">Коктейлі</button>
      <button class="type-btn" onclick="setType('hookah',this)">Кальяни</button>
    </div>
    <div class="pills" id="pills"></div>
    <div class="menu-body" id="mbody"></div>
  </div>

  <!-- ADMIN PAGE -->
  <div id="ap" class="page">
    <div class="admin-top">
      <h2>Панель управління</h2>
      <p>Налаштування меню</p>
    </div>

    <div class="asec">
      <div class="asec-label">Назва закладу</div>
      <div class="card">
        <div class="fg"><label>Назва</label><input id="rn" placeholder="Введіть назву закладу..." oninput="upName()">
        </div>
        <div class="fg" style="margin-bottom:0"><label>Підзаголовок</label><input id="rs"
            placeholder="Наприклад: Bar & Kitchen" oninput="upSub()"></div>
      </div>
    </div>

    <hr class="sep-line">

    <div class="asec">
      <div class="asec-label">Нова категорія</div>
      <div class="card">
        <div class="fg"><label>Назва категорії</label><input id="ncn" placeholder="Наприклад: Страви з риби"></div>
        <div class="fg" style="margin-bottom:0">
          <label>Тип</label>
          <select id="nct">
            <option value="food">&#127869; Їжа</option>
            <option value="drink">&#127865; Коктейлі / Напої</option>
            <option value="hookah">&#128168; Кальяни</option>
          </select>
        </div>
        <div style="margin-top:14px"><button class="btn btn-g bw" onclick="addCat()">+ Додати категорію</button></div>
      </div>
    </div>

    <div class="asec">
      <div class="asec-label">Категорії</div>
      <div id="catList"></div>
    </div>

    <hr class="sep-line">

    <div class="asec">
      <div class="asec-label">Нова позиція в меню</div>
      <div class="card">
        <div class="fg"><label>Категорія</label><select id="ics">
            <option value="">— Оберіть категорію —</option>
          </select></div>
        <div class="fg"><label>Назва страви / напою</label><input id="iname"
            placeholder="Наприклад: Карпаччо з телятини"></div>
        <div class="fg"><label>Склад / опис</label><textarea id="icomp"
            placeholder="Телятина, пармезан, руккола, каперси..."></textarea></div>
        <div class="fg" style="margin-bottom:0"><label>Ціна (грн)</label><input type="number" id="iprice"
            placeholder="0" min="0"></div>
        <div style="margin-top:14px"><button class="btn btn-g bw" onclick="addItem()">+ Додати позицію</button></div>
      </div>
    </div>

    <div class="asec">
      <div class="asec-label">Всі позиції</div>
      <div class="atabs">
        <button class="atab on" onclick="setAT('food',this)">Їжа</button>
        <button class="atab" onclick="setAT('drink',this)">Коктейлі</button>
        <button class="atab" onclick="setAT('hookah',this)">Кальяни</button>
      </div>
      <div id="alist"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var S = {
      name: 'Назва закладу',
      sub: 'Меню закладу',
      cats: [
        { id: 'c1', name: 'Холодні закуски', type: 'food' },
        { id: 'c2', name: 'Салати', type: 'food' },
        { id: 'c3', name: 'Страви з риби', type: 'food' },
        { id: 'c4', name: 'Страви з птиці', type: 'food' },
        { id: 'c5', name: 'Страви зі свинини', type: 'food' },
        { id: 'c6', name: 'Гарячі страви', type: 'food' },
        { id: 'c7', name: 'Страви з картоплі', type: 'food' },
        { id: 'c8', name: 'Коктейлі', type: 'drink' },
        { id: 'c9', name: 'Кальяни', type: 'hookah' }
      ],
      items: [],
      menuType: 'food',
      menuCat: null,
      atype: 'food'
    };

    try {
      var d = localStorage.getItem('menuSite');
      if (d) { var p = JSON.parse(d); S = Object.assign(S, p); }
    } catch (e) { }

    function sv() { try { localStorage.setItem('menuSite', JSON.stringify(S)); } catch (e) { } }
    function gid() { return 'i' + Date.now() + Math.random().toString(36).slice(2, 5); }

    document.getElementById('rn').value = S.name;
    document.getElementById('rs').value = S.sub;
    document.getElementById('hname').textContent = S.name;
    document.getElementById('hsub').textContent = S.sub;

    function toast(m) {
      var t = document.getElementById('toast');
      t.textContent = m; t.classList.add('on');
      setTimeout(function () { t.classList.remove('on'); }, 2200);
    }

    function goPage(id) {
      document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on'); });
      document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('on'); });
      document.getElementById(id).classList.add('on');
      document.querySelectorAll('.nav-btn')[id === 'mp' ? 0 : 1].classList.add('on');
      if (id === 'mp') renderMenu(); else renderAdmin();
    }

    function upName() {
      S.name = document.getElementById('rn').value || 'Назва закладу';
      document.getElementById('hname').textContent = S.name;
      document.title = S.name + ' — Меню';
      sv();
    }
    function upSub() {
      S.sub = document.getElementById('rs').value || 'Меню закладу';
      document.getElementById('hsub').textContent = S.sub;
      sv();
    }

    function setType(t, btn) {
      S.menuType = t; S.menuCat = null;
      document.querySelectorAll('.type-btn').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      renderMenu();
    }

    function filterCat(id) { S.menuCat = id; renderPills(); renderDishes(); }

    function renderMenu() { renderPills(); renderDishes(); }

    function renderPills() {
      var cats = S.cats.filter(function (c) { return c.type === S.menuType; });
      var el = document.getElementById('pills');
      var h = '<button class="pill' + (S.menuCat === null ? ' on' : '') + '" onclick="filterCat(null)">Всі</button>';
      cats.forEach(function (c) {
        var n = S.items.filter(function (i) { return i.catId === c.id; }).length;
        h += '<button class="pill' + (S.menuCat === c.id ? ' on' : '') + '" onclick="filterCat(\'' + c.id + '\')">'
          + c.name + (n ? ' &middot; ' + n : '') + '</button>';
      });
      el.innerHTML = h;
    }

    function renderDishes() {
      var cats = S.cats.filter(function (c) { return c.type === S.menuType; });
      var vis = S.menuCat ? cats.filter(function (c) { return c.id === S.menuCat; }) : cats;
      var el = document.getElementById('mbody');
      if (!vis.length) { el.innerHTML = '<div class="hint">Категорії ще не додані.<br>Перейдіть в Адмін і додайте перші позиції.</div>'; return; }
      var h = '';
      vis.forEach(function (cat) {
        var items = S.items.filter(function (i) { return i.catId === cat.id; });
        h += '<div class="cat-block">'
          + '<div class="cat-header">'
          + '<div class="cat-header-line"></div>'
          + '<div class="cat-deco"></div>'
          + '<div class="cat-title">' + cat.name + '</div>'
          + '<div class="cat-deco"></div>'
          + '<div class="cat-header-line"></div>'
          + '</div>';
        if (!items.length) {
          h += '<div class="empty-cat">Ще немає позицій у цій категорії</div>';
        } else {
          h += '<div class="items-wrap">';
          items.forEach(function (it) {
            h += '<div class="dish">'
              + '<div class="dish-left">'
              + '<div class="dish-name">' + it.name + '</div>'
              + (it.comp ? '<div class="dish-comp">' + it.comp + '</div>' : '')
              + '</div>'
              + '<div class="dish-dots"></div>'
              + '<div class="dish-price">' + Math.round(it.price) + ' <span class="dish-price-unit">грн</span></div>'
              + '</div>';
          });
          h += '</div>';
        }
        h += '</div>';
      });
      el.innerHTML = h;
    }

    function addCat() {
      var name = document.getElementById('ncn').value.trim();
      var type = document.getElementById('nct').value;
      if (!name) { toast('Введіть назву категорії'); return; }
      S.cats.push({ id: gid(), name: name, type: type });
      document.getElementById('ncn').value = '';
      sv(); renderAdmin(); renderMenu(); toast('Категорію додано!');
    }

    function delCat(id) {
      if (!confirm('Видалити категорію і всі позиції в ній?')) return;
      S.cats = S.cats.filter(function (c) { return c.id !== id; });
      S.items = S.items.filter(function (i) { return i.catId !== id; });
      sv(); renderAdmin(); renderMenu(); toast('Категорію видалено');
    }

    function addItem() {
      var catId = document.getElementById('ics').value;
      var name = document.getElementById('iname').value.trim();
      var comp = document.getElementById('icomp').value.trim();
      var price = document.getElementById('iprice').value;
      if (!catId) { toast('Оберіть категорію'); return; }
      if (!name) { toast('Введіть назву'); return; }
      if (!price) { toast('Введіть ціну'); return; }
      var cat = S.cats.find(function (c) { return c.id === catId; });
      S.items.push({ id: gid(), catId: catId, name: name, comp: comp, price: parseFloat(price), type: cat.type });
      document.getElementById('iname').value = '';
      document.getElementById('icomp').value = '';
      document.getElementById('iprice').value = '';
      sv(); renderAdmin(); renderMenu(); toast('Позицію додано!');
    }

    function delItem(id) {
      S.items = S.items.filter(function (i) { return i.id !== id; });
      sv(); renderAdmin(); renderMenu(); toast('Позицію видалено');
    }

    function setAT(t, btn) {
      S.atype = t;
      document.querySelectorAll('.atab').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      renderAItems();
    }

    function renderAdmin() {
      var sel = document.getElementById('ics');
      var prev = sel.value;
      sel.innerHTML = '<option value="">— Оберіть категорію —</option>';
      S.cats.forEach(function (c) {
        var e = c.type === 'food' ? '&#127869;' : c.type === 'drink' ? '&#127865;' : '&#128168;';
        sel.innerHTML += '<option value="' + c.id + '"' + (prev === c.id ? ' selected' : '') + '>' + e + ' ' + c.name + '</option>';
      });

      var cl = document.getElementById('catList');
      if (!S.cats.length) { cl.innerHTML = '<div class="hint">Ще немає категорій</div>'; }
      else {
        var h = '<div class="cat-list">';
        S.cats.forEach(function (c) {
          var cnt = S.items.filter(function (i) { return i.catId === c.id; }).length;
          var bc = c.type === 'food' ? 'bf' : c.type === 'drink' ? 'bd' : 'bh';
          var bl = c.type === 'food' ? 'Їжа' : c.type === 'drink' ? 'Напій' : 'Кальян';
          h += '<div class="cat-row">'
            + '<span class="badge ' + bc + '">' + bl + '</span>'
            + '<span class="cat-row-name">' + c.name + '</span>'
            + '<span class="cat-row-count">' + cnt + ' поз.</span>'
            + '<button class="btn-del" onclick="delCat(\'' + c.id + '\')">&#10005;</button>'
            + '</div>';
        });
        cl.innerHTML = h + '</div>';
      }
      renderAItems();
    }

    function renderAItems() {
      var cats = S.cats.filter(function (c) { return c.type === S.atype; });
      var el = document.getElementById('alist');
      if (!cats.length) { el.innerHTML = '<div class="hint">Немає категорій цього типу</div>'; return; }
      var h = '';
      cats.forEach(function (cat) {
        var items = S.items.filter(function (i) { return i.catId === cat.id; });
        h += '<div style="margin-bottom:18px">'
          + '<div style="font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;text-transform:uppercase">' + cat.name + '</div>';
        if (!items.length) {
          h += '<div class="hint">Немає позицій</div>';
        } else {
          h += '<div class="alist">';
          items.forEach(function (it) {
            h += '<div class="aitem">'
              + '<div class="aitem-info">'
              + '<div class="aitem-name">' + it.name + '</div>'
              + (it.comp ? '<div class="aitem-sub">' + it.comp.slice(0, 55) + (it.comp.length > 55 ? '&hellip;' : '') + '</div>' : '')
              + '</div>'
              + '<div class="aitem-price">' + Math.round(it.price) + ' грн</div>'
              + '<button class="btn-del" onclick="delItem(\'' + it.id + '\')">&#10005;</button>'
              + '</div>';
          });
          h += '</div>';
        }
        h += '</div>';
      });
      el.innerHTML = h;
    }

    renderMenu();
    renderAdmin();
    document.title = S.name + ' — Меню';
  </script>
</body>

</html>
