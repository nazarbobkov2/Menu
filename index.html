*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#BFA46A;--gold-dim:#8C7545;--dark:#141210;--dark2:#1E1A16;--dark3:#28231D;--cream2:#C8B99A;--text:#EDE3D0;--muted:#8A7D68;--sep:rgba(191,164,106,0.18);--danger:#C86060}
html,body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
.nav{display:flex;background:var(--dark2);border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:100}
.nav-btn{flex:1;padding:15px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.25s;position:relative}
.nav-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.nav-btn:hover:not(.on){color:var(--text)}
.cart-badge{position:absolute;top:8px;right:calc(50% - 24px);background:var(--gold);color:var(--dark);font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;padding:0 3px}
.cart-badge.show{opacity:1}
.page{display:none}.page.on{display:block}
.hero{text-align:center;padding:48px 24px 32px;background:var(--dark2);border-bottom:1px solid var(--sep)}
.hero-name{font-family:'Fraunces',serif;font-size:48px;font-weight:300;color:var(--gold);letter-spacing:5px;line-height:1}
.hero-rule{width:52px;height:1px;background:var(--gold-dim);margin:14px auto}
.hero-sub{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--muted)}
.type-nav{display:flex;background:var(--dark2);border-bottom:1px solid var(--sep)}
.type-btn{flex:1;padding:13px;text-align:center;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s}
.type-btn.on{color:var(--gold);border-bottom-color:var(--gold)}
.type-btn:hover:not(.on){color:var(--text)}
.pills{display:flex;gap:8px;padding:16px 16px 6px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:6px 14px;border-radius:100px;border:1px solid var(--sep);background:none;color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s;flex-shrink:0}
.pill.on{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:500}
.pill:hover:not(.on){border-color:var(--gold-dim);color:var(--cream2)}
.menu-body{padding:20px 16px 140px;max-width:900px;margin:0 auto}
.cat-block{margin-bottom:40px}
.cat-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cat-header-line{flex:1;height:1px;background:var(--sep)}
.cat-title{font-family:'Fraunces',serif;font-size:11px;font-weight:400;letter-spacing:4px;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.cat-deco{width:5px;height:5px;border:1px solid var(--gold-dim);transform:rotate(45deg);flex-shrink:0}
.items-wrap{display:flex;flex-direction:column;gap:8px}
.dish{display:flex;gap:14px;padding:14px;background:var(--dark2);border:1px solid var(--sep);border-radius:10px;align-items:center;transition:.2s}
.dish:hover{border-color:rgba(191,164,106,0.3)}
.dish-photo{width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0}
.dish-photo-placeholder{width:80px;height:80px;border-radius:8px;flex-shrink:0;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.3}
.dish-middle{flex:1;min-width:0}
.dish-name{font-family:'Fraunces',serif;font-size:19px;font-weight:400;color:var(--text);line-height:1.2}
.dish-comp{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}
.dish-price{font-family:'Fraunces',serif;font-size:18px;color:var(--gold);margin-top:6px}
.dish-price-unit{font-family:'Inter',sans-serif;font-size:10px;color:var(--muted)}
.dish-right{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.add-btn{width:36px;height:36px;border-radius:50%;background:var(--gold);border:none;color:var(--dark);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;line-height:1}
.add-btn:hover{opacity:.85;transform:scale(1.08)}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{width:30px;height:30px;border-radius:50%;background:var(--dark3);border:1px solid var(--sep);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.qty-btn:hover{border-color:var(--gold);color:var(--gold)}
.qty-num{font-family:'Fraunces',serif;font-size:20px;color:var(--gold);min-width:22px;text-align:center}
.empty-cat{padding:20px 0;text-align:center;color:var(--muted);font-size:13px}
.hint{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;line-height:1.9}
#cp{padding:0 0 40px}
.cart-top{padding:28px 20px 20px;background:var(--dark2);border-bottom:1px solid var(--sep)}
.cart-top h2{font-family:'Fraunces',serif;font-size:34px;font-weight:300;color:var(--gold)}
.cart-top p{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.cart-body{max-width:680px;margin:0 auto;padding:16px 16px 0}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--dark2);border:1px solid var(--sep);border-radius:10px;margin-bottom:8px}
.cart-item-photo{width:52px;height:52px;border-radius:7px;object-fit:cover;flex-shrink:0}
.cart-item-photo-empty{width:52px;height:52px;border-radius:7px;background:var(--dark3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.4}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:14px;font-weight:500}
.cart-item-unit{font-size:11px;color:var(--muted);margin-top:2px}
.cart-item-ctrl{display:flex;align-items:center;gap:8px}
.cart-qty-btn{width:28px;height:28px;border-radius:50%;background:var(--dark3);border:1px solid var(--sep);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.cart-qty-btn:hover{border-color:var(--gold);color:var(--gold)}
.cart-qty-num{font-family:'Fraunces',serif;font-size:18px;color:var(--gold);min-width:20px;text-align:center}
.cart-item-total{font-family:'Fraunces',serif;font-size:17px;color:var(--gold);margin-left:4px;white-space:nowrap;flex-shrink:0}
.total-row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-top:1px solid var(--sep);margin-top:8px}
.total-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.total-val{font-family:'Fraunces',serif;font-size:32px;color:var(--gold)}
.total-unit{font-size:12px;color:var(--muted)}
.cart-actions{display:flex;gap:10px;margin-top:14px}
.cart-float{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:none;width:calc(100% - 32px);max-width:500px}
.cart-float.show{display:flex}
.cart-float-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--gold);color:var(--dark);border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,0.5);transition:.2s}
.cart-float-btn:hover{opacity:.9;transform:translateY(-2px)}
.cart-float-left{display:flex;align-items:center;gap:10px}
.cart-float-count{background:rgba(0,0,0,0.15);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:700}
.cart-float-sum{font-size:15px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn-g{background:var(--gold);color:var(--dark);font-weight:600}
.btn-g:hover{opacity:.88}
.btn-outline{background:none;border:1px solid var(--sep);color:var(--muted)}
.btn-outline:hover{border-color:var(--gold-dim);color:var(--text)}
.btn-danger{background:none;border:1px solid rgba(200,80,80,0.2);color:var(--danger);cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;border-radius:8px;padding:12px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.btn-danger:hover{background:rgba(200,80,80,0.1)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:.25s;pointer-events:none}
.overlay.show{opacity:1;pointer-events:all}
.modal-box{background:var(--dark2);border:1px solid var(--sep);border-radius:14px;padding:24px 20px;width:100%;max-width:320px;transform:scale(.96);transition:.25s}
.overlay.show .modal-box{transform:scale(1)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--gold);color:var(--dark);padding:10px 24px;border-radius:100px;font-size:12px;font-weight:500;letter-spacing:1px;opacity:0;transition:.3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
</style>
</head>

<div id="mp" class="page on">

  </div>

</div>

<div id="cp" class="page">

    <p>Підрахунок суми замовлення</p>
  </div>
  <div class="cart-body">
    <div id="cartEmpty" style="display:none">

      </div>
    </div>
    <div id="cartItemsList"></div>
    <div id="cartFooter" style="display:none">
      <div class="total-row">
        <span class="total-label">Разом</span>
        <span class="total-val" id="cartTotal">0 <span class="total-unit">грн</span></span>
      </div>
      <div class="cart-actions">
        <button class="btn btn-outline" onclick="goPage('mp')" style="flex:1">&#8592; Меню</button>
        <button class="btn-danger" onclick="clearCart()" style="flex:1">&#128465; Очистити</button>
      </div>
    </div>
  </div>
</div>

<div class="cart-float" id="cartFloat">
  <button class="cart-float-btn" onclick="goPage('cp')">
    <div class="cart-float-left">
      <span>Обрані</span>
      <span class="cart-float-count" id="floatCount">0</span>
    </div>
    <span class="cart-float-sum" id="floatSum">0 грн</span>
  </button>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal-box">
    <div style="font-size:15px;color:var(--text);line-height:1.5;margin-bottom:20px;text-align:center" id="confirmText"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" style="flex:1" onclick="closeConfirm()">Скасувати</button>
      <button class="btn btn-g" style="flex:1" id="confirmBtn">Так</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

var cart = [];
var menuType = 'food';
var menuCat  = null;

try { var cv = localStorage.getItem('cartClean'); if (cv) cart = JSON.parse(cv); } catch(e) {}

function saveCart() { try { localStorage.setItem('cartClean', JSON.stringify(cart)); } catch(e) {} }

function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
function showConfirm(text, cb) {
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmOverlay').classList.add('show');
  document.getElementById('confirmBtn').onclick = function(){ closeConfirm(); cb(); };
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }

function goPage(id) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('on'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.nav-btn')[id === 'mp' ? 0 : 1].classList.add('on');
  if (id === 'mp') renderMenu(); else renderCart();
}

function getTotal() {
  return cart.reduce(function(s, ci) {
    var it = ITEMS.find(function(i){ return i.id === ci.itemId; });
    return it ? s + it.price * ci.qty : s;
  }, 0);
}
function getCount() { return cart.reduce(function(s, ci){ return s + ci.qty; }, 0); }

function updateCartUI() {
  var count = getCount(), total = getTotal();
  document.getElementById('cartBadge').textContent = count;
  document.getElementById('cartBadge').classList.toggle('show', count > 0);
  document.getElementById('cartFloat').classList.toggle('show', count > 0);
  document.getElementById('floatCount').textContent = count;
  document.getElementById('floatSum').textContent = Math.round(total) + ' грн';
}

function addToCart(id) {
  var ci = cart.find(function(c){ return c.itemId === id; });
  if (ci) { ci.qty++; } else { cart.push({itemId: id, qty: 1}); }
  saveCart(); updateCartUI(); renderMenu();
  if (document.getElementById('cp').classList.contains('on')) renderCart();
  else toast('Додано до обраних!');
}
function removeFromCart(id) {
  var ci = cart.find(function(c){ return c.itemId === id; });
  if (!ci) return;
  ci.qty--;
  if (ci.qty <= 0) cart = cart.filter(function(c){ return c.itemId !== id; });
  saveCart(); updateCartUI(); renderMenu();
  if (document.getElementById('cp').classList.contains('on')) renderCart();
}
function getQty(id) { var ci = cart.find(function(c){ return c.itemId === id; }); return ci ? ci.qty : 0; }

function clearCart() {
  showConfirm('Очистити список обраних?', function(){
    cart = []; saveCart(); updateCartUI(); renderMenu(); renderCart();
  });
}

function renderCart() {
  var isEmpty = cart.length === 0;
  document.getElementById('cartEmpty').style.display  = isEmpty ? 'block' : 'none';
  document.getElementById('cartFooter').style.display = isEmpty ? 'none'  : 'block';
  var el = document.getElementById('cartItemsList');
  if (isEmpty) { el.innerHTML = ''; return; }
  document.getElementById('cartTotal').innerHTML = Math.round(getTotal()) + ' <span class="total-unit">грн</span>';
  var h = '';
  cart.forEach(function(ci) {
    var it = ITEMS.find(function(i){ return i.id === ci.itemId; });
    if (!it) return;
    var thumb = it.photo
      ? '<img class="cart-item-photo" src="' + it.photo + '" alt="">'
      : '<div class="cart-item-photo-empty">&#127869;</div>';
    var iid = it.id;
    h += '<div class="cart-item">' + thumb
      + '<div class="cart-item-info"><div class="cart-item-name">' + it.name + '</div>'
      + '<div class="cart-item-unit">' + Math.round(it.price) + ' грн &times; ' + ci.qty + '</div></div>'
      + '<div class="cart-item-ctrl">'
      + '<button class="cart-qty-btn" data-id="' + iid + '" data-act="remove">&#8722;</button>'
      + '<span class="cart-qty-num">' + ci.qty + '</span>'
      + '<button class="cart-qty-btn" data-id="' + iid + '" data-act="add">&#43;</button>'
      + '</div>'
      + '<div class="cart-item-total">' + Math.round(it.price * ci.qty) + ' грн</div>'
      + '</div>';
  });
  el.innerHTML = h;
}

function setType(t, btn) {
  menuType = t; menuCat = null;
  document.querySelectorAll('.type-btn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on'); renderMenu();
}
function filterCat(id) { menuCat = id; renderPills(); renderDishes(); }
function renderMenu() { renderPills(); renderDishes(); }

function renderPills() {
  var cats = CATS.filter(function(c){ return c.type === menuType; });
  if (menuCat === null && cats.length > 0) { menuCat = cats[0].id; }
  var h = '';
  cats.forEach(function(c) {
    h += '<button class="pill' + (menuCat === c.id ? ' on' : '') + '" data-cat="' + c.id + '">' + c.name + '</button>';
  });
  document.getElementById('pills').innerHTML = h;
}

function renderDishes() {
  var cats = CATS.filter(function(c){ return c.type === menuType; });
  var vis  = menuCat ? cats.filter(function(c){ return c.id === menuCat; }) : cats;
  var el   = document.getElementById('mbody');
  if (!vis.length) { el.innerHTML = '<div class="hint">Немає позицій.</div>'; return; }
  var h = '';
  vis.forEach(function(cat) {
    var items = ITEMS.filter(function(i){ return i.catId === cat.id; });
    h += '<div class="cat-block">'
      + '<div class="cat-header"><div class="cat-header-line"></div><div class="cat-deco"></div>'
      + '<div class="cat-title">' + cat.name + '</div>'
      + '<div class="cat-deco"></div><div class="cat-header-line"></div></div>';
    if (!items.length) {
      h += '<div class="empty-cat">Немає позицій</div>';
    } else {
      h += '<div class="items-wrap">';
      items.forEach(function(it) {
        var qty   = getQty(it.id);
        var photo = it.photo
          ? '<img class="dish-photo" src="' + it.photo + '" alt="' + it.name + '">'
          : '<div class="dish-photo-placeholder">&#127869;</div>';
        var ctrl  = qty > 0
          ? '<div class="qty-ctrl">'
            + '<button class="qty-btn" data-id="' + it.id + '" data-act="remove">&#8722;</button>'
            + '<span class="qty-num">' + qty + '</span>'
            + '<button class="qty-btn" data-id="' + it.id + '" data-act="add">&#43;</button>'
            + '</div>'
          : '<button class="add-btn" data-id="' + it.id + '" data-act="add">+</button>';
        h += '<div class="dish">' + photo
          + '<div class="dish-middle">'
          + '<div class="dish-name">' + it.name + '</div>'
          + (it.comp ? '<div class="dish-comp">' + it.comp + '</div>' : '')
          + '<div class="dish-price">' + Math.round(it.price) + ' <span class="dish-price-unit">грн</span></div>'
          + '</div><div class="dish-right">' + ctrl + '</div></div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  el.innerHTML = h;
}


// Event delegation
document.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-act]');
  if (btn) {
    var id  = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    if (act === 'add')    addToCart(id);
    if (act === 'remove') removeFromCart(id);
    return;
  }
  var pill = e.target.closest('[data-cat]');
  if (pill) {
    filterCat(pill.getAttribute('data-cat'));
  }
});

updateCartUI();
renderMenu();
</script>
